services:
  gatekeeper:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:1128:1128"
    env_file:
      - .env.prod
    environment:
      HOST: 0.0.0.0
      PORT: 1128
      # Container listener binds all interfaces; keep administration disabled.
      # For the admin console, use the documented host-network + loopback setup.
      WEBUI_ENABLED: "false"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    security_opt:
      - no-new-privileges:true
