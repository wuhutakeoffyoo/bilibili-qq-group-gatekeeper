[project]
name = "bilibili-qq-group-gatekeeper"
version = "0.3.0"
description = "Standalone FastAPI and OneBot QQ group gatekeeper with Bilibili verification"
readme = "README.md"
license = "MIT"
authors = [{ name = "NyakoWW" }]
requires-python = ">=3.10,<4.0"
keywords = ["fastapi", "onebot", "napcat", "qq", "bilibili"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "tzdata>=2025.1",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "qrcode>=8.0",
    "pillow>=12.3.0",
    "cryptography>=50.0.0",
    "aiofiles>=24.0.0",
    "websockets>=12.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
# Old adapter regression coverage and the explicit compatibility entry point.
legacy = ["nonebot2[fastapi]>=2.5.0", "nonebot-adapter-onebot>=2.4.6"]

[project.urls]
Homepage = "https://github.com/wuhutakeoffyoo/bilibili-qq-group-gatekeeper"
Repository = "https://github.com/wuhutakeoffyoo/bilibili-qq-group-gatekeeper"
Issues = "https://github.com/wuhutakeoffyoo/bilibili-qq-group-gatekeeper/issues"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "hypothesis>=6.100.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
# E501（超长行）暂不启用：存量代码有约 70 处超长行，待统一格式化时再开启
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 测试文件需先 nonebot.init() 再导入插件模块，属于刻意的导入顺序
"tests/**" = ["E402"]

# The optional compatibility bridge is explicitly loaded by legacy_bot.py.
# Never automatically discover the archived schema-3 plugin implementation.
