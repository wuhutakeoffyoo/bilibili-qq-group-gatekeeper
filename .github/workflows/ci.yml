name: CI

on:
  push:
    branches: [main, dev, codex/dev]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff
        run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra legacy

      - name: Run tests
        run: uv run --extra legacy python -m unittest discover -s tests

      - name: Compile Python sources
        run: uv run --extra legacy python -m compileall -q bot.py app src tests

  standalone:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install default dependencies
        run: uv sync --locked
      - name: Verify NoneBot is absent
        run: uv run python -c "import importlib.util; assert importlib.util.find_spec('nonebot') is None; from app.main import create_app; create_app()"
      - name: Standalone integration tests
        run: uv run python -m unittest discover -s tests -p 'test_v3_*.py'
