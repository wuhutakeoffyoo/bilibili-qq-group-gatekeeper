name: Bug 报告
description: 报告可复现的程序错误
title: "[Bug]: "
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: 请先删除日志中的 Cookie、Token、QQ 号、群号、邮箱和服务器地址。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？预期行为是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 配置……
        2. 发送……
        3. 出现……
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: 版本或提交
      placeholder: 例如 v0.1.0 或提交短哈希
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已删除所有凭据和个人信息
          required: true
        - label: 这不是安全漏洞；安全漏洞将按 SECURITY.md 私下报告
          required: true
