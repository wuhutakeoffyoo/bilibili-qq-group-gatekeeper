# =============================================================================
# groups.yaml — 群基础审核配置（可直接提交至 Git）
# =============================================================================
# 用途：集中管理所有群的基础审核参数、自定义拒绝名单、以及审核流程文件路径。
#       结合 review_pipeline.yaml 使用后，.env.prod 只需保留 GROUP_CONFIG_FILE=groups.yaml。
#
# 用法：按实际需求修改即可。每个群的字段会覆盖 defaults 中的同名字段。
#       此文件不含敏感信息，可安全提交至 Git。
# =============================================================================

# ---------------------------------------------------------------------------
# defaults — 默认值（所有群共享的兜底配置）
# ---------------------------------------------------------------------------
defaults:
  # 开源示例默认关闭。填写真实群号和主播 UID 后，再改为 true。
  enabled: false

  # 筛选组 A：QQ 等级小于 4 级为 F；无法读取为 I
  required_qq_level: 4

  # 筛选组 A：B站等级小于 2 级为 F
  required_bili_level: 2

  # 拒绝时是否在理由中附带退群时间；true=附带，false=不附带
  reject_reason_with_leave_time: false

  # 各条件判定为 F 时的管理员补充说明，可按群设置。
  # 最终发送时程序会自动添加半角前缀“来自BOT:”。
  # 程序按实际条件自动生成具体反馈；可按条件补充管理员说明。
  reject_reasons: {}

  # 审核流程文件路径；相对路径按本 groups.yaml 所在目录解析
  # 指向 review_pipeline.yaml，定义审核分组流转逻辑
  review_pipeline_file: review_pipeline.yaml

# ---------------------------------------------------------------------------
# groups — 各群独立配置（群号作为 key）
# ---------------------------------------------------------------------------
groups:
  # 示例群号。使用前请替换成真实群号，并确认目标 UID。
  "123456789":
    # 需要关注的 B站 UID 列表（用于 follow 条件检查）
    # 多个 UID 之间是“满足任意一个即可”关系
    target_uids: []

    # 需要检查粉丝牌的主播 UID 列表（用于 medal 条件检查）
    # 多个 UID 之间是“满足任意一个即可”关系
    target_medal_uids: []

    # 筛选组 B 只要求持有目标主播粉丝灯牌，1 级及以上即视为 T
    required_medal_level: 1

    # 自定义拒绝名单：key 为 B站 UID，value 为对应拒绝理由
    # 命中时直接拒绝，不会继续后续审核
    custom_reject_uids: {}
